c_stdlib_version:          # [osx]
  - 11.0                   # [osx]
MACOSX_SDK_VERSION:        # [osx]
  - '12.3'                 # [osx]

c_compiler:                # [win]
  - vs2022                 # [win]
cxx_compiler:              # [win]
  - vs2022                 # [win]

vtk:
  - '9.6'

# Upload beta builds to the conda-forge "beta" label instead of "main".
# Installable via: conda install -c conda-forge/label/beta -c conda-forge tomviz
channel_targets:
  - conda-forge beta
